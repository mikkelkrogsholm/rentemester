[workspace]
members = ["crates/rentemester-application", "crates/rentemester-engine", "crates/rentemester-storage", "crates/rentemester-cli", "crates/rentemester-runtime"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
