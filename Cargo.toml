[workspace]
default-members = ["crates/rentemester-host", "crates/rentemester-application", "crates/rentemester-engine", "crates/rentemester-storage", "crates/rentemester-cli", "crates/rentemester-client", "crates/rentemester-mcp", "crates/rentemester-runtime", "crates/rentemester-server"]
members = ["crates/rentemester-desktop", "crates/rentemester-host", "crates/rentemester-application", "crates/rentemester-engine", "crates/rentemester-storage", "crates/rentemester-cli", "crates/rentemester-client", "crates/rentemester-mcp", "crates/rentemester-runtime", "crates/rentemester-server"]
exclude = ["vendor/rusqlite-0.40.2", "vendor/libsqlite3-sys-0.38.2"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[patch.crates-io]
rusqlite = { path = "vendor/rusqlite-0.40.2" }
libsqlite3-sys = { path = "vendor/libsqlite3-sys-0.38.2" }
