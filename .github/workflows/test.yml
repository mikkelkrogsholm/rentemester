name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Keep the required `test` context stable, but leave the thousands of Bun
    # tests to `bun run verify:local` on the multi-core development machine.
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck runtime and release scripts
        run: bun run typecheck:runtime

      - name: Verify agent discovery coverage
        run: bun run agent-discovery:coverage

      - name: Verify StyleX ownership and generated document styles
        run: bun run stylex:check

      - name: Lint TypeScript and React sources
        run: bun run lint

      - name: Refuse vulnerable dependencies
        run: bun run supply-chain:audit

      - name: Verify production dependency licenses
        run: bun run supply-chain:licenses

  app-production-build:
    name: cockpit production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build cockpit
        run: bun run cockpit:build

  windows-root-safety:
    # This tiny platform-specific check cannot be reproduced by macOS Docker.
    name: Windows restore and cleanup safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run native Windows restore and cleanup tests
        run: bun test tests/unit/system-restore-target-guard.test.ts tests/unit/windows-filesystem-safety.test.ts
