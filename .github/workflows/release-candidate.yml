name: release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer from package.json, without v"
        required: true
        type: string
      runtime:
        description: "Candidate runtime; Bun is an explicit legacy route"
        required: true
        type: choice
        default: rust
        options: [rust, bun]
      commit:
        description: "Full 40-character Git commit to build"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ inputs.version }}-${{ inputs.commit }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.0
  BUN_BASE_IMAGE_DIGEST: sha256:e0ee68d16ccb9927bf02aa7dd8fd4bf3369ee6d46da04faa72b05ce8bfd135f6
  REGISTRY_IMAGE: ghcr.io/mikkelkrogsholm/rentemester

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    name: build and publish run-unique candidate
    runs-on: ${{ inputs.runtime == 'rust' && vars.RENTEMESTER_RUST_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Resolve deterministic identity
        id: identity
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_RUNTIME: ${{ inputs.runtime }}
        run: |
          set -euo pipefail
          case "$REQUESTED_RUNTIME" in rust|bun) ;; *) echo "runtime must be rust or bun" >&2; exit 1 ;; esac
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit must be a full 40-character Git id" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if [ "$commit" != "$REQUESTED_COMMIT" ]; then
            echo "checkout resolved to $commit, expected $REQUESTED_COMMIT" >&2
            exit 1
          fi
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "candidate commit must equal the workflow-dispatch head of main ($GITHUB_SHA)" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          [ "$commit" = "$(git rev-parse origin/main)" ] || { echo "candidate must equal current main HEAD" >&2; exit 1; }
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "candidate commit must be reachable from origin/main" >&2
            exit 1
          fi
          version="$(bun run scripts/release/check-version.ts "$REQUESTED_VERSION")"
          source_date_epoch="$(git show -s --format=%ct "$commit")"
          built_at="$(SOURCE_DATE_EPOCH="$source_date_epoch" bun -e 'console.log(new Date(Number(process.env.SOURCE_DATE_EPOCH)*1000).toISOString().replace(".000Z","Z"))')"
          candidate_tag="candidate-v${version}-${commit}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$source_date_epoch" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck runtime and release scripts
        run: bun run typecheck:runtime

      - name: Verify agent discovery coverage
        run: bun run agent-discovery:coverage

      - name: Lint TypeScript and React sources
        run: bun run lint

      - name: Refuse vulnerable dependencies
        run: bun run supply-chain:audit

      - name: Verify production dependency licenses
        run: bun run supply-chain:licenses

      - name: Verify locked all-platform Rust dependency licenses
        run: bun run supply-chain:licenses:rust

      - name: Create lockfile-bound supply-chain evidence
        if: inputs.runtime == 'bun'
        id: supply_chain
        run: |
          bun run supply-chain:evidence > supply-chain-evidence.json
          sha256sum supply-chain-evidence.json > supply-chain-evidence.json.sha256
          echo "sha256=sha256:$(cut -d " " -f 1 supply-chain-evidence.json.sha256)" >> "$GITHUB_OUTPUT"

      - name: Build cockpit
        run: bun run cockpit:build

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Verify reproducible OCI export
        if: inputs.runtime == 'bun'
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_GIT_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
          RENTEMESTER_BUN_VERSION: ${{ env.BUN_VERSION }}
          RENTEMESTER_BASE_IMAGE_DIGEST: ${{ env.BUN_BASE_IMAGE_DIGEST }}
        run: bun run container:reproducibility

      - name: Verify container readiness and persisted restart
        if: inputs.runtime == 'bun'
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_GIT_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
          RENTEMESTER_BUN_VERSION: ${{ env.BUN_VERSION }}
          RENTEMESTER_BASE_IMAGE_DIGEST: ${{ env.BUN_BASE_IMAGE_DIGEST }}
        run: bun run container:test

      - name: Check Rust release runner capacity
        if: inputs.runtime == 'rust'
        run: |
          python3 - <<'PYSPACE'
          import platform, shutil
          if platform.system() != 'Linux' or platform.machine() not in ('x86_64', 'AMD64'):
              raise SystemExit('Rust release requires a Linux x64 runner; configure RENTEMESTER_RUST_RELEASE_RUNNER.')
          free = shutil.disk_usage('.').free
          if free < 30 * 1024**3:
              raise SystemExit('Rust release requires at least 30 GiB free on the source volume; configure a sufficient existing runner with RENTEMESTER_RUST_RELEASE_RUNNER. Build-volume guards remain active.')
          print('Rust release source-volume preflight passed; Cargo still checks source and build volumes.')
          PYSPACE

      - name: Install packaged Rust browser acceptance runtime
        if: inputs.runtime == 'rust'
        run: bunx --no-install playwright install --with-deps chromium

      - name: Verify clean candidate source
        if: inputs.runtime == 'rust'
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain --untracked-files=normal)"
          if [ -n "$source_status" ]; then
            echo "Rust candidate source includes tracked changes or untracked inputs" >&2
            printf '%s\n' "$source_status" >&2
            exit 1
          fi

      - name: Verify independent cold Rust OCI exports
        if: inputs.runtime == 'rust'
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_GIT_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        run: bun run scripts/release/rust-candidate.ts reproducibility

      - name: Verify Rust readiness, normal owner and persisted restart
        if: inputs.runtime == 'rust'
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_GIT_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        run: bun run scripts/release/rust-candidate.ts readiness

      - name: Refuse to overwrite a candidate tag
        env:
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          registry_status="$(bun run scripts/release/registry-manifest-status.ts "$REGISTRY_IMAGE" "$CANDIDATE_TAG")"
          if [ "$registry_status" = 200 ]; then
            echo "candidate tag already exists; publisher policy forbids overwrite: $REGISTRY_IMAGE:$CANDIDATE_TAG" >&2
            exit 1
          fi
          [ "$registry_status" = 404 ] || { echo "unexpected GHCR status: $registry_status" >&2; exit 1; }

      - name: Build and push candidate image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          builder: ${{ inputs.runtime == 'rust' && format('rm-rust-{0}-{1}-first', github.run_id, github.run_attempt) || '' }}
          file: ${{ inputs.runtime == 'rust' && 'Dockerfile.rust' || 'Dockerfile' }}
          platforms: linux/amd64
          tags: ${{ env.REGISTRY_IMAGE }}:${{ steps.identity.outputs.candidate_tag }}
          outputs: type=registry,rewrite-timestamp=true${{ inputs.runtime == 'rust' && ',oci-mediatypes=true' || '' }}
          build-args: |
            RENTEMESTER_VERSION=${{ steps.identity.outputs.version }}
            RENTEMESTER_GIT_COMMIT=${{ steps.identity.outputs.commit }}
            RENTEMESTER_BUILT_AT=${{ steps.identity.outputs.built_at }}
            RENTEMESTER_BUN_VERSION=${{ env.BUN_VERSION }}
            RENTEMESTER_BASE_IMAGE_DIGEST=${{ env.BUN_BASE_IMAGE_DIGEST }}
            SOURCE_DATE_EPOCH=${{ steps.identity.outputs.source_date_epoch }}
            RENTEMESTER_SOURCE_DIRTY=false
            CARGO_BUILD_JOBS=2
            RUST_BUILD_CACHE_ID=release-${{ github.run_id }}-${{ github.run_attempt }}-first
          # BuildKit publishes an SPDX SBOM attestation bound to this OCI digest.
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the published candidate digest
        if: inputs.runtime == 'bun'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_BUN_VERSION: ${{ env.BUN_VERSION }}
          EXPECTED_BASE_IMAGE_DIGEST: ${{ env.BUN_BASE_IMAGE_DIGEST }}
        run: |
          set -euo pipefail
          image="$REGISTRY_IMAGE@$IMAGE_DIGEST"
          docker pull "$image"
          docker image inspect "$image" --format '{{json .Config.Env}}' \
            | jq -e 'index("RENTEMESTER_APP_AUTH=required") != null'
          docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.base.digest"}}' \
            | grep -Fx "$EXPECTED_BASE_IMAGE_DIGEST"
          docker image inspect "$image" --format '{{index .Config.Labels "org.rentemester.runtime.bun.version"}}' \
            | grep -Fx "$EXPECTED_BUN_VERSION"
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /workspace:rw,nosuid,size=64m,uid=1000,gid=1000 \
            --tmpfs /import:rw,nosuid,size=64m,uid=1000,gid=1000 \
            -e RENTEMESTER_APP_AUTH=off \
            -e EXPECTED_VERSION \
            -e EXPECTED_COMMIT \
            -e EXPECTED_BUN_VERSION \
            -e EXPECTED_BASE_IMAGE_DIGEST \
            --entrypoint sh \
            "$image" \
            -c 'set -eu
                test "$(id -u)" = 1000
                test "$(bun --version)" = "$EXPECTED_BUN_VERSION"
                bun run src/cli.ts --version | grep -F "rentemester $EXPECTED_VERSION commit $EXPECTED_COMMIT"
                bun run src/cli.ts documents ingest --example >/tmp/documents-example.json
                bun -e '\''const metadata=await Bun.file("/tmp/documents-example.json").json(); if(metadata.source!=="email"||metadata.currency!=="DKK"||typeof metadata.amountIncVat!=="number") throw new Error("documents ingest example invalid")'\''
                bun run src/cli.ts serve --workspace /workspace --host 0.0.0.0 --port 4319 >/tmp/server.log 2>&1 &
                server_pid=$!
                trap "kill $server_pid 2>/dev/null || true" EXIT
                bun -e '\''const base="http://127.0.0.1:4319/"; let health; for(let i=0;i<100;i++){try{const response=await fetch(new URL("api/health",base)); if(response.ok){health=await response.json(); break}}catch{} await Bun.sleep(100)} if(!health) throw new Error("server did not become healthy"); if(health.build.version!==process.env.EXPECTED_VERSION||health.build.gitCommit!==process.env.EXPECTED_COMMIT||health.build.bunVersion!==process.env.EXPECTED_BUN_VERSION||health.build.baseImageDigest!==process.env.EXPECTED_BASE_IMAGE_DIGEST) throw new Error("wrong build identity"); const html=await fetch(base).then(r=>{if(!r.ok) throw new Error(`cockpit index ${r.status}`); return r.text()}); const asset=/src="([^"]+\.js)"/.exec(html)?.[1]; if(!asset) throw new Error("cockpit asset missing"); const js=await fetch(new URL(asset,base)).then(r=>{if(!r.ok) throw new Error(`cockpit asset ${r.status}`); return r.text()}); if(!js.includes(process.env.EXPECTED_VERSION)) throw new Error("cockpit version missing")'\'''

      - name: Render the published local-container cockpit
        if: inputs.runtime == 'bun'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY_IMAGE@$IMAGE_DIGEST"
          container="rentemester-candidate-ui-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" --read-only \
            --publish 127.0.0.1::4319 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /workspace:rw,nosuid,size=64m,uid=1000,gid=1000 \
            --tmpfs /import:rw,nosuid,size=64m,uid=1000,gid=1000 \
            --env RENTEMESTER_DEPLOYMENT_PROFILE=local-container \
            --env RENTEMESTER_APP_AUTH=off \
            "$image"
          address="$(docker port "$container" 4319/tcp)"
          [[ "$address" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          base_url="http://$address"
          BASE_URL="$base_url" bun -e 'for(let i=0;i<100;i++){try{const r=await fetch(`${process.env.BASE_URL}/api/ready`); if(r.ok) process.exit(0)}catch{} await Bun.sleep(100)} process.exit(1)'
          docker exec "$container" bun run src/cli.ts company add \
            --workspace /workspace --name "Release Check" --slug release-check \
            --bank-name Testbank --bank-reg 1234 --bank-account 5678901234
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          for route in \
            "/companies/release-check?year=2026" \
            "/companies/release-check/manage?source=release-candidate"; do
            rendered="cockpit-rendered-$(echo "$route" | tr '/?=&' '-')".html
            "$chrome" --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$base_url$route" > "$rendered"
            grep -F '<div id="root"><div class="app-shell"' "$rendered"
            grep -F 'Release Check' "$rendered"
            if grep -Fq 'Kunne ikke bekræfte Rentemesters sikkerhedsprofil' "$rendered"; then
              echo "local-container cockpit was rejected by the UI security-profile gate" >&2
              exit 1
            fi
          done

      - name: Extract digest-bound SPDX SBOM evidence
        if: inputs.runtime == 'bun'
        id: sbom
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY_IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image" --format '{{ json .SBOM }}' > sbom.spdx.json
          bun -e 'const value=await Bun.file("sbom.spdx.json").json(); if(!value || typeof value!=="object" || Array.isArray(value)) throw new Error("published image has no object SBOM"); const sbom=value.SPDX??value; if(!sbom || typeof sbom!=="object" || Array.isArray(sbom)) throw new Error("published image has no SPDX document"); await Bun.write("sbom.spdx.json", `${JSON.stringify(sbom)}\n`)'
          bun -e 'const sbom=await Bun.file("sbom.spdx.json").json(); const packages=Array.isArray(sbom.packages)?sbom.packages:[]; if(!packages.some(p=>p?.name==="pdfjs-dist"&&String(p?.versionInfo??"")==="6.2.108")) throw new Error("SBOM must contain pdfjs-dist@6.2.108")'
          sha256sum sbom.spdx.json > sbom.spdx.json.sha256
          echo "sha256=sha256:$(cut -d " " -f 1 sbom.spdx.json.sha256)" >> "$GITHUB_OUTPUT"

      - name: Verify packaged agent-discovery coverage identity
        if: inputs.runtime == 'bun'
        id: agent_discovery
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          image="$REGISTRY_IMAGE@$IMAGE_DIGEST"
          docker pull "$image"
          docker run --rm --read-only \
            -e RENTEMESTER_AGENT_DISCOVERY_IMAGE_DIGEST="$IMAGE_DIGEST" \
            --entrypoint bun "$image" \
            run src/agent-discovery-coverage-cli.ts > agent-discovery-coverage-report.json
          bun -e '
            const report=await Bun.file("agent-discovery-coverage-report.json").json();
            if(report.ok!==true) throw new Error("packaged discovery gate is not green");
            if(report.imageDigest!==process.env.IMAGE_DIGEST) throw new Error("coverage evidence is not bound to the image digest");
            if(report.catalogue?.build?.version!==process.env.EXPECTED_VERSION) throw new Error("coverage evidence has the wrong version");
            if(report.catalogue?.build?.gitCommit!==process.env.EXPECTED_COMMIT) throw new Error("coverage evidence has the wrong commit");
          '
          sha256sum agent-discovery-coverage-report.json > agent-discovery-coverage-report.json.sha256
          echo "sha256=sha256:$(cut -d " " -f 1 agent-discovery-coverage-report.json.sha256)" >> "$GITHUB_OUTPUT"

      - name: Create digest-bound release manifest
        if: inputs.runtime == 'bun'
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_GIT_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
          RELEASE_IMAGE_REPOSITORY: ${{ env.REGISTRY_IMAGE }}
          RELEASE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          RELEASE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          RENTEMESTER_GIT_COMMIT: ${{ steps.identity.outputs.commit }}
          RENTEMESTER_BUILT_AT: ${{ steps.identity.outputs.built_at }}
          RENTEMESTER_BUN_VERSION: ${{ env.BUN_VERSION }}
          RENTEMESTER_BASE_IMAGE_DIGEST: ${{ env.BUN_BASE_IMAGE_DIGEST }}
          RELEASE_SBOM_SHA256: ${{ steps.sbom.outputs.sha256 }}
          RELEASE_SUPPLY_CHAIN_SHA256: ${{ steps.supply_chain.outputs.sha256 }}
          RELEASE_AGENT_DISCOVERY_SHA256: ${{ steps.agent_discovery.outputs.sha256 }}
        run: |
          bun run scripts/release/create-manifest.ts > release-manifest.json
          sha256sum release-manifest.json > release-manifest.json.sha256

      - name: Verify published immutable Rust bytes
        if: inputs.runtime == 'rust'
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_GIT_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bun run scripts/release/rust-candidate.ts smoke

      - name: Qualify exact Rust package, SPDX and full original discovery
        if: inputs.runtime == 'rust'
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_GIT_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_BUILT_AT: ${{ steps.identity.outputs.built_at }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bun run scripts/release/rust-candidate.ts qualify

      - name: Attest candidate image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Upload candidate evidence for Digisense
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Artifact names are scoped to a run. A fixed exact name prevents a
          # promotion from merging evidence from multiple candidate artifacts.
          name: release-candidate-evidence
          path: |
            release-manifest.json
            release-manifest.json.sha256
            rust-build-identity.json
            rust-build-identity.json.sha256
            rust-package-evidence.json
            rust-package-evidence.json.sha256
            rust-license-evidence.json
            rust-license-evidence.json.sha256
            sbom.spdx.json
            sbom.spdx.json.sha256
            supply-chain-evidence.json
            supply-chain-evidence.json.sha256
            agent-discovery-coverage-report.json
            agent-discovery-coverage-report.json.sha256
            docs/release/digisense-approval.schema.json
          if-no-files-found: error
          retention-days: 90

      - name: Candidate summary
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          DIGEST: ${{ steps.image.outputs.digest }}
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
          CANDIDATE_RUNTIME: ${{ inputs.runtime }}
        run: |
          {
            echo "## Rentemester release candidate"
            echo
            echo "- Runtime: $CANDIDATE_RUNTIME"
            echo "- Version: \`$VERSION\`"
            echo "- Commit: \`$COMMIT\`"
            echo "- Review status: **not reviewed by Digisense**"
            echo "- Candidate: \`$REGISTRY_IMAGE:$CANDIDATE_TAG\`"
            echo "- Immutable digest: \`$REGISTRY_IMAGE@$DIGEST\`"
            echo "- SPDX SBOM: BuildKit OCI attestation bound to the immutable digest"
            echo "- Supply chain: runtime-specific exact evidence and locked license verification"
            echo
            echo "This candidate can be pulled and deployed before review. Pin the digest, not the tag:"
            echo
            echo "\`\`\`sh"
            echo "docker pull $REGISTRY_IMAGE@$DIGEST"
            if [ "$CANDIDATE_RUNTIME" = rust ]; then
              echo "# Rust requires an explicit authenticated /config/server.json and persistent /state."
              echo "# Use the native Rust deployment profile; the legacy compose example is Bun-only."
            else
              echo "RENTEMESTER_IMAGE=$REGISTRY_IMAGE@$DIGEST docker compose -f docker-compose.example.yml up -d"
            fi
            echo "\`\`\`"
            echo
            echo "Deploying it does not make it Digisense-approved. Approval later promotes these exact bytes without rebuilding."
            echo
            echo "Download the release-candidate artifact and send the manifest digest, image digest, checked SPDX SBOM and supply-chain evidence to Digisense."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove completed Rust candidate builder
        if: always() && inputs.runtime == 'rust'
        run: docker buildx rm "rm-rust-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-first" 2>/dev/null || true
