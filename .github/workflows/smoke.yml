name: smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    # Keep the required `smoke` context stable. Its contract is now the actual
    # image build/readiness/reproducibility gate, not a duplicate source suite.
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Verify headless Chrome startup for release evidence
        run: bun run scripts/release/cockpit-evidence-browser.ts

      - name: Build and verify the local container profile
        run: bun run container:test

      - name: Verify two clean builds are byte-identical by OCI content identity
        run: bun run container:reproducibility
