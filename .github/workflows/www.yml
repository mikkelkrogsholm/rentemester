name: www

on:
  pull_request:
    branches: [main]
    paths:
      - "www/**"
      - "scripts/stylex-precompile.ts"
      - "scripts/check-stylex.ts"
      - "DESIGN.md"
      - ".github/workflows/www.yml"
  push:
    branches: [main]
    paths:
      - "www/**"
      - "scripts/stylex-precompile.ts"
      - "scripts/check-stylex.ts"
      - "DESIGN.md"
      - ".github/workflows/www.yml"

concurrency:
  group: www-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: independent www checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: www
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check site map
        run: bun run site:check
      - name: Check graph content coverage
        run: bun run content:coverage
      - name: Verify StyleX compiler and watcher
        run: bun run test
      - name: Build static site
        run: bun run build
      - name: Verify generated SVG artifacts
        run: git diff --exit-code -- public/favicon.svg public/og-*.svg
      - name: Install browser engines
        run: bunx playwright install --with-deps chromium webkit
      - name: Verify site in Chromium and WebKit
        run: bun run test:browser
