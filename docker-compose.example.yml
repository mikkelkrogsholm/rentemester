services:
  rentemester:
    # A candidate or approved release may be selected. Pin @sha256 for an
    # immutable deployment; never use `latest`. Candidate use does not imply
    # Digisense approval.
    image: ${RENTEMESTER_IMAGE:?set RENTEMESTER_IMAGE to an exact ghcr.io digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4319:4319"
    environment:
      RENTEMESTER_WORKSPACE: /workspace
      # workspace.json is authoritative; register only the canonical live
      # company here. Restore/test copies may remain mounted but are excluded.
      # Explicit no-login container profile. It may bind the container's
      # internal interface only because the published host port is hard-bound
      # to loopback above. Never publish this profile on 0.0.0.0.
      RENTEMESTER_DEPLOYMENT_PROFILE: local-container
      RENTEMESTER_APP_AUTH: off
    volumes:
      - rentemester-workspace:/workspace
      - rentemester-imports:/import
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  rentemester-workspace:
  rentemester-imports:
