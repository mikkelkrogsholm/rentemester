[package]
name = "rentemester-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Bounded pure XML parsing for existing versioned legal-source corpus.
roxmltree = "=0.20.0"
base64 = "=0.22.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2", "deflate-flate2-zlib-rs"] }
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
sha2 = "0.10"
ryu-js = "=1.0.3"
unicode-properties = "=0.1.4"
num-bigint = "0.5"
time = "0.3"
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "=0.1.25"
regex = "=1.13.1"
chrono-tz = { version = "=0.10.4", default-features = false }

[lints]
workspace = true
