[package]
name = "rentemester-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "rentemester_identity"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
sha1 = "0.10.6"
scrypt = { version = "0.11.0", default-features = false }
unicode-normalization = "=0.1.25"
subtle = "2.6.1"
zeroize = "1.8"
getrandom = "0.4.3"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22.1"
hmac = "0.12.1"
ring = "=0.17.14"
sha2 = "0.10"
percent-encoding = "2.3"
url = "=2.5.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "hickory-dns", "rustls"] }
webpki-root-certs = "=1.0.9"
hickory-resolver = "=0.26.3"
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "=0.13.0"
libproc = "=0.14.11"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.5", features = ["thread"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
