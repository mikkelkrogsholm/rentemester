[package]
name = "rentemester-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
rentemester-engine = { path = "../rentemester-engine" }
rusqlite = { version = "0.40.2", features = ["bundled", "rentemester_identity"] }
ryu-js = "1.0.3"
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
time = "0.3"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[lints]
workspace = true
