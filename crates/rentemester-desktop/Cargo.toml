[package]
name = "rentemester-desktop"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
publish.workspace = true
default-run = "rentemester-desktop"
autobins = false

[[bin]]
name = "rentemester-desktop"
path = "src/shell.rs"

[[bin]]
name = "rentemester-desktop-gpui"
path = "src/main.rs"
required-features = ["legacy-gpui"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
legacy-gpui = ["dep:gpui-kit"]

[dependencies]
base64 = "0.22.1"
sha2 = "0.10"
gpui-kit = { version = "=0.7.3", optional = true }
tauri = "=2.12.4"
serde.workspace = true
rentemester-runtime = { path = "../rentemester-runtime" }
rentemester-client = { path = "../rentemester-client" }
ring = "=0.17.14"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
rfd = { version = "=0.17.2", default-features = false }

[build-dependencies]
tauri-build = "2"

[lints]
workspace = true
