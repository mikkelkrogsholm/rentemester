[package]
name = "rentemester-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
rentemester-application = { path = "../rentemester-application" }
rentemester-runtime = { path = "../rentemester-runtime" }
rentemester-storage = { path = "../rentemester-storage" }
serde.workspace = true
serde_json.workspace = true
url = "=2.5.8"
zeroize = "1.8"

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true
