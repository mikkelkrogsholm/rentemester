[package]
name = "rentemester-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
rentemester-application = { path = "../rentemester-application" }
rentemester-runtime = { path = "../rentemester-runtime" }
rentemester-storage = { path = "../rentemester-storage" }
rentemester-host = { path = "../rentemester-host" }
rentemester-engine = { path = "../rentemester-engine" }
serde.workspace = true
serde_json.workspace = true
url = "=2.5.8"
zeroize = "1.8"
percent-encoding = "2.3"
subtle = "2.6.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
tower-http = { version = "=0.6.11", features = ["fs", "set-header"] }

[dev-dependencies]
hmac = "0.12.1"
sha1 = "0.10.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true
